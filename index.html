<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo-sena-verde-complementario-svg-2022.svg" type="image/svg+xml">
    <title>SENA - Caracterización Integral</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script>
        // Extensión de colores institucionales SENA
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sena: {
                            green: '#39A900', // Verde Oficial SENA
                            black: '#2F2F2F', // Gris oscuro institucional
                            light: '#F3F4F6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Animaciones suaves para transiciones de la SPA */
        .view-transition {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
                scale: 0.98;
            }

            to {
                opacity: 1;
                transform: translateY(0);
                scale: 1;
            }
        }

        /* Gradient Text */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(135deg, #39A900 0%, #003632 100%);
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<!-- Body with subtle pattern background -->

<body
    class="bg-gray-50 text-sena-black antialiased min-h-screen flex flex-col bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <header
        class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-200 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center space-x-4">
                    <img src="logo-sena-verde-complementario-svg-2022.svg" alt="Logo SENA"
                        class="h-12 w-12 hover:rotate-12 transition-transform duration-500">
                    <div>
                        <h1 class="text-xl font-bold leading-none text-gray-900 tracking-tight">Caracterización <span
                                class="text-sena-green">Integral</span></h1>
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mt-1">Formación
                            Profesional Integral</p>
                    </div>
                </div>

                <nav id="nav-links" class="flex items-center space-x-6">
                    <button onclick="App.navigate('guide')"
                        class="hidden md:flex items-center gap-2 text-xs font-bold text-gray-500 hover:text-sena-green transition-colors uppercase tracking-wider bg-gray-50 hover:bg-white px-3 py-1.5 rounded-lg border border-transparent hover:border-gray-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                            </path>
                        </svg>
                        Guía Pedagógica
                    </button>
                    <div id="headerUser" class="ml-4"></div>
                </nav>
            </div>
        </div>
    </header>

    <main id="app" class="view-transition flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-col justify-center items-center h-96 space-y-4">
            <div class="relative w-16 h-16">
                <div class="absolute top-0 left-0 w-full h-full border-4 border-gray-200 rounded-full"></div>
                <div
                    class="absolute top-0 left-0 w-full h-full border-4 border-sena-green border-t-transparent rounded-full animate-spin">
                </div>
            </div>
            <p class="text-gray-500 font-medium animate-pulse">Cargando instrumentos pedagógicos...</p>
        </div>
    </main>

    <footer class="bg-sena-black text-white mt-auto">
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                <div class="text-center md:text-left text-sm opacity-90 space-y-1">
                    <p class="font-bold text-base text-sena-green">Servicio Nacional de Aprendizaje SENA</p>
                    <p>Regional Boyacá - Centro Minero</p>
                    <p class="font-medium">Diego Alonso Ojeda Medina</p>
                    <p class="text-xs text-gray-400">dojedam@sena.edu.co</p>
                </div>
                <div class="text-center md:text-right text-xs opacity-60">
                    <p>Estrategia de Caracterización basada en DUA</p>
                    <p>&copy; <span id="footer-year"></span> Todos los derechos reservados.</p>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>

</html>
